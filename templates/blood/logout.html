<!DOCTYPE html>
<html>
<head>
    <title>Logout</title>

    <style>
        body {
            font-family: Arial;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .box {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            color: darkred;
        }

        a {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: darkred;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        a:hover {
            background: red;
        }
    </style>
</head>

<body>

    <div class="box">
        <h2>✅ You have been logged out</h2>
        <p>Thank you for using Blood Bank System</p>

        <a href="{% url 'admin-login' %}">Login Again</a>
        <br><br>
        <a href="{% url '' %}">Go to Home</a>
    </div>

</body>
</html>
