<!DOCTYPE html>
<html>
<head>
    <title>Donor Panel</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f4f6f9;
        }

        /* Sidebar */
        .sidebar {
            width: 220px;
            height: 100vh;
            background-color: darkred;
            position: fixed;
            padding-top: 20px;
        }

        .sidebar h2 {
            color: white;
            text-align: center;
        }

        .sidebar a {
            display: block;
            color: white;
            padding: 10px;
            text-decoration: none;
        }

        .sidebar a:hover {
            background-color: red;
        }

        /* Content */
        .content {
            margin-left: 220px;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 15px;
            box-shadow: 0 0 5px #ccc;
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <h2>🩸 Donor</h2>

        <a href="{% url 'donor-dashboard' %}">Dashboard</a>
        <a href="{% url 'donate-blood' %}">Donate Blood</a>
        <a href="{% url 'donation-history' %}">Donation History</a>
        <a href="{% url 'logout' %}">Logout</a>
    </div>

    <!-- Main Content -->
    <div class="content">

        <div class="header">
            <h2>Donor Panel</h2>
        </div>

        {% block content %}
        {% endblock %}

    </div>

</body>
</html>
